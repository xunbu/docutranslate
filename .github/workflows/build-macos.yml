name: Build macOS Application

on:
  # 允许手动触发工作流
  workflow_dispatch:
  # 发布正式版或预发布版时自动触发
  release:
    types: [published]

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            spec: lite_mac.spec
            executable_suffix: mac
          - arch: x86_64
            runner: macos-15-intel
            spec: lite_mac_x86_64.spec
            executable_suffix: mac-x86
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # setup-uv 自 v8 起不再发布 vN 浮动 tag（只有 v1~v7），必须写具体版本
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.6.14'

      - name: Install dependencies with uv
        run: uv sync --locked --no-dev --extra mcp

      - name: Build the application with PyInstaller
        run: |
          uv pip install pyinstaller==6.22.2
          uv run --no-sync pyinstaller "${{ matrix.spec }}" --noconfirm --clean

      - name: Get application version
        id: get_version
        run: |
          VERSION=$(uv run --no-sync python -c "import docutranslate; print(docutranslate.__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create macOS app bundle structure
        run: |
          # 创建必要的目录
          mkdir -p dist/DocuTranslate.app/Contents/MacOS
          mkdir -p dist/DocuTranslate.app/Contents/Resources
          
          # 移动可执行文件到 .app 包中
          mv "dist/DocuTranslate-${{ env.VERSION }}-${{ matrix.executable_suffix }}" dist/DocuTranslate.app/Contents/MacOS/DocuTranslate
          chmod +x dist/DocuTranslate.app/Contents/MacOS/DocuTranslate

          # Finder 不会为 .app 自动打开终端，通过启动器显示服务日志和实际访问地址。
          cp scripts/macos/DocuTranslateLauncher dist/DocuTranslate.app/Contents/MacOS/
          cp scripts/macos/DocuTranslate.command dist/DocuTranslate.app/Contents/MacOS/
          chmod +x dist/DocuTranslate.app/Contents/MacOS/DocuTranslateLauncher \
            dist/DocuTranslate.app/Contents/MacOS/DocuTranslate.command
          /bin/bash -n dist/DocuTranslate.app/Contents/MacOS/DocuTranslateLauncher
          /bin/bash -n dist/DocuTranslate.app/Contents/MacOS/DocuTranslate.command
          
          # 复制应用图标
          cp DocuTranslate.icns dist/DocuTranslate.app/Contents/Resources/
          
          # 动态创建 Info.plist 文件
          cat > dist/DocuTranslate.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DocuTranslateLauncher</string>
              <key>CFBundleIconFile</key>
              <string>DocuTranslate.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.xunbu.docutranslate</string>
              <key>CFBundleName</key>
              <string>DocuTranslate</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ env.VERSION }}</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
        shell: bash

      - name: Create DMG Disk Image with version
        run: |
          hdiutil create -volname "DocuTranslate Installer" -srcfolder dist/DocuTranslate.app -ov -format UDZO "dist/DocuTranslate-${{ env.VERSION }}-macOS-${{ matrix.arch }}.dmg"

      # 这样你就可以在工作流运行结束后下载它，或者在 release 中使用它。
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DocuTranslate-macOS-${{ matrix.arch }}
          path: dist/DocuTranslate-${{ env.VERSION }}-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-macos:
    # 与 Windows 保持一致：发布 Release 时把 DMG 自动挂上去
    if: github.event_name == 'release'
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: DocuTranslate-macOS-*
          path: release-assets
      - name: Attach DMGs to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(release-assets/*/*.dmg)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected two macOS DMGs (arm64 + x86_64), found ${#files[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
