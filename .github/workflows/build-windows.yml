name: Build Windows Application

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 第 1 步: 检出你的代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第 2 步: 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 第 3 步: 安装 uv
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: '0.6.14'

      # 第 4 步: 安装依赖
      - name: Install dependencies with uv
        run: |
          uv sync --locked --no-dev --extra mcp

      # 第 5 步: 安装 UPX (简化版本)
      - name: Install UPX
        run: |
          choco install upx -y

      # 第 6 步: 运行 PyInstaller
      - name: Build the application with PyInstaller
        run: |
          uv pip install pyinstaller==6.22.2
          uv run --no-sync pyinstaller lite.spec --noconfirm --clean

      # 第 7 步: 上传 exe 文件作为构建产物
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DocuTranslate-Windows
          path: dist/*.exe
          if-no-files-found: error

  publish-windows:
    if: github.event_name == 'release'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: DocuTranslate-Windows
          path: release-assets
      - name: Attach executable to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected one Windows executable, found ${#files[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
