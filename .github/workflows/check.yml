name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # setup-uv 自 v8 起不再发布 vN 浮动 tag（只有 v1~v7），必须写具体版本
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.6.14'
      - name: Install locked dependencies
        run: uv sync --locked --group dev --extra mcp
      - name: Run Python tests
        run: |
          uv run --no-sync pytest tests -o addopts= -q --tb=short \
            --cov=docutranslate --cov-report=term --cov-fail-under=55

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 必须与提交进去的构建产物所用版本一致：产物 hash 随 Node 版本变化，
          # 用别的版本重建会被下面的“静态资源一致性”检查判为不一致
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Verify committed static assets match the frontend sources
        # 随包静态资源是提交进仓库的：重建后工作区必须干净（含新增文件），
        # 否则说明有人改了前端源码却没提交构建产物。
        run: |
          if [ -n "$(git status --porcelain -- docutranslate/static)" ]; then
            git status --porcelain -- docutranslate/static
            echo "docutranslate/static 与前端源码不一致：请在 frontend/ 运行 npm run build 并提交结果。" >&2
            exit 1
          fi
